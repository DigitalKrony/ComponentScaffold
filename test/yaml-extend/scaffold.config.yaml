    structure:
      - type: folder
        name: __dir_test__
        content:
        - type: file
          name: index
          extension: js
          content: // Test File
  - dir: ./src
    friendlyName: Feature Test 2
    nameCase: kabab
    structure:
      - type: folder
        name: __dir_test__
        content:
        - type: file
          name: index
